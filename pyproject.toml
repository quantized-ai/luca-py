[project]
name = "luca-ai"
version = "0.1.0"
description = "AI Agent Toolkit and unified LLM access client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.14.1",
    "pre-commit>=4.6.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=1.1.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.0",
]
docker = [
    "aiodocker>=0.27.0",
]
tui = [
    "pyyaml>=6",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
]
skills = [
    "pyyaml>=6",
]
ssh = [
    "asyncssh>=2.24.0",
    "paramiko>=5.0.0",
]

[tool.pytest.ini_options]
addopts = [
    "-W", "error::ResourceWarning",
    "--strict-markers",
    "--strict-config",
    # Live tests are DESELECTED, not skipped: a contributor with real AWS
    # credentials exported would otherwise spend money on a plain test run.
    # A `-m live` on the command line replaces this and selects them.
    "-m", "not live",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:The frame locals reference is no longer cached.*:DeprecationWarning",
]
markers = [
    "live: hits a real provider over the network; opt in with `-m live`",
]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev", "tui", "skills"]

[tool.hatch.build.targets.wheel]
packages = ["luca"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Component sheet — the model menu against the real catalog, mid-query.
#
# The menu component itself is covered by components/menu.yaml with a short,
# unfiltered list. This sheet is the state that only exists once models come
# from models.dev: hundreds of rows behind the query, so the counter carries
# the total, the options container scrolls, and each row's secondary column is
# the model's context window — the one fact that tells these rows apart.
name: components/model_menu
status:
  cwd: ~/quantized/luca
  model: claude-sonnet-5
  branch: main
  tokens: 12.4k
  cost: $0.08
transcript:
  - kind: user
    text: /model
overlay:
  mode: menu
  sigil: /
  query: sonnet
  counter: 5 of 271
  selected: 3
  column: 40
  rows:
    - {primary: anthropic/claude-sonnet-4, secondary: 200.0k}
    - {primary: anthropic/claude-sonnet-4.5, secondary: 200.0k}
    - {primary: anthropic/claude-sonnet-4.6, secondary: 1000.0k}
    - {primary: anthropic/claude-sonnet-5, secondary: 1000.0k}
    - {primary: mistralai/mistral-sonnet, secondary: 128.0k}
hints: [↑↓ move, enter pick, esc dismiss]
